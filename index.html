<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BAKESAH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: one calm column (mobile-first). Bottom tab bar under 900px, left rail from 900px up.
   Help pill stays in the top bar on every app screen. Display serif for headings, Figtree for UI. */
:root{
  --bg:#FAF8F2; --surface:#FFFFFF; --soft:#DCEBE7; --peach:#F4DDD2;
  --fg:#253633; --fg2:#42544F; --muted:#667571; --line:#E3DFD3;
  --primary:#245C59; --on-primary:#FFFFFF; --alert:#8E3A1C; --focus:#9A4A12;
  --font-display:"Newsreader","Iowan Old Style",Georgia,serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-sm:10px; --r-md:16px; --r-lg:22px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
  --shadow:0 1px 2px rgba(37,54,51,.06),0 6px 18px rgba(37,54,51,.07);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131E1D; --surface:#1B2A28; --soft:#233B38; --peach:#3B2C26;
    --fg:#E8EFEC; --fg2:#C3D1CC; --muted:#9DB0AA; --line:#2E4440;
    --primary:#7CC4BC; --on-primary:#0E1D1B; --alert:#F0AA8B; --focus:#F0B27A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131E1D; --surface:#1B2A28; --soft:#233B38; --peach:#3B2C26;
  --fg:#E8EFEC; --fg2:#C3D1CC; --muted:#9DB0AA; --line:#2E4440;
  --primary:#7CC4BC; --on-primary:#0E1D1B; --alert:#F0AA8B; --focus:#F0B27A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px}
html[data-size="large"]{font-size:19px}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:1rem;line-height:1.55;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em;line-height:1.15}
h1{font-size:1.9rem}
h2{font-size:1.4rem}
h3{font-size:1.05rem;font-weight:600;font-family:var(--font-body)}
p{margin:0}
ul,ol{margin:0;padding-left:1.2rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1:focus{outline:none}
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--fg2)}
.stack{display:flex;flex-direction:column;gap:var(--s-4)}
.stack-lg{display:flex;flex-direction:column;gap:var(--s-5)}
.row{display:flex;gap:var(--s-3);flex-wrap:wrap;align-items:center}

/* shell */
.app{max-width:1040px;margin:0 auto}
.col{max-width:640px;margin:0 auto;min-width:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:var(--s-5)}
.demo-strip{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);padding:6px 0 0}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:6px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:1.3rem;font-weight:600;letter-spacing:.02em}
.brand svg{flex:none}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.navbtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;
  background:none;border:0;border-radius:var(--r-sm);color:var(--fg2);font-size:.74rem;font-weight:500;cursor:pointer;padding:4px 2px}
.navbtn[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--soft)}
.navbtn[aria-current="page"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:48px;padding-top:var(--s-5)}
  .rail{display:flex;flex-direction:column;gap:var(--s-4);position:sticky;top:var(--s-5);align-self:start;max-height:calc(100vh - 48px)}
  .rail .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 14px;font-size:.98rem;min-height:48px}
  .rail .navbtn[aria-current="page"]::after{display:none}
  .rail-nav{display:flex;flex-direction:column;gap:4px}
  .bottomnav{display:none}
  .col{margin:0;padding-bottom:48px}
  .topbar{position:static;border:0;margin-bottom:var(--s-4)}
  .topbar .brand{display:none}
  .topbar-row{justify-content:flex-end}
}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:14px;
  border:1.5px solid transparent;font-weight:600;font-size:1rem;cursor:pointer;text-align:center;line-height:1.25}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-outline{background:transparent;color:var(--primary);border-color:var(--primary)}
.btn-soft{background:var(--soft);color:var(--fg)}
.btn-text{background:none;color:var(--primary);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:8px 10px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.helppill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--alert);
  background:var(--peach);color:var(--fg);font-weight:700;font-size:.92rem;cursor:pointer}
.helppill svg{color:var(--alert)}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:6px 12px 6px 6px;margin-left:-6px;background:none;border:0;color:var(--primary);font-weight:600;cursor:pointer;border-radius:12px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-5);box-shadow:var(--shadow)}
.card-flat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-4)}
.band{background:var(--soft);border-radius:var(--r-lg);padding:var(--s-5)}
.band-peach{background:var(--peach);border-radius:var(--r-lg);padding:var(--s-5)}
.notice{display:flex;gap:var(--s-3);align-items:flex-start;border-radius:var(--r-md);padding:var(--s-4);border:1.5px solid var(--line);background:var(--surface);font-size:.95rem}
.notice > svg{flex:none;margin-top:2px}
.notice-sim{background:var(--peach);border-color:var(--alert)}
.notice-sim > svg{color:var(--alert)}
.notice-soft{background:var(--soft);border-color:transparent}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1.5px solid var(--fg2);color:var(--fg2);background:transparent;white-space:nowrap}
.tag-sim{border-color:var(--alert);color:var(--alert);background:var(--peach)}
.tag-ok{border-color:var(--primary);color:var(--primary);background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:4px 12px;border-radius:999px;background:var(--soft);color:var(--fg)}
.page-title{display:flex;flex-direction:column;gap:var(--s-2)}

/* welcome */
.plain{max-width:560px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top,0px)) 48px}
.hero-mark{display:flex;align-items:center;gap:14px}
.hero-title{font-size:2.6rem;font-weight:600;letter-spacing:.04em}
.tagline{font-family:var(--font-display);font-style:italic;font-size:1.35rem;color:var(--fg2);line-height:1.3}
.facts{display:grid;gap:var(--s-3)}
.fact{display:grid;grid-template-columns:40px 1fr;gap:var(--s-3);align-items:start}
.fact-ic{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;color:var(--primary)}

/* home */
.greet{display:flex;flex-direction:column;gap:6px}
.mood-hero{display:grid;grid-template-columns:1fr auto;gap:var(--s-4);align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3)}
@media (max-width:340px){.grid2{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;min-height:150px;padding:var(--s-4);border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--fg);box-shadow:var(--shadow)}
.tile-ic{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.tile h3{font-size:1.02rem}
.tile small{color:var(--fg2);font-size:.86rem;line-height:1.4}
.tile-help{background:var(--peach);border-color:var(--alert)}
.tile-help .tile-ic{background:var(--surface);color:var(--alert)}
.tile-main{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:var(--s-4);background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.tile-main .tile-ic{background:rgba(255,255,255,.16);color:var(--on-primary)}
.tile-main small{color:var(--on-primary);opacity:.92}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s-3)}
@media (min-width:420px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{display:flex;flex-direction:column;gap:2px;padding:var(--s-3);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--font-display);font-size:1.9rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--fg2);line-height:1.3}

/* lists */
.list{display:flex;flex-direction:column;gap:var(--s-3);list-style:none;padding:0;margin:0}
.mod{display:grid;grid-template-columns:1fr auto;gap:var(--s-3);align-items:center;width:100%;text-align:left;padding:var(--s-4);border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);cursor:pointer;color:var(--fg)}
.mod h3{margin-bottom:4px}
.mod p{font-size:.9rem;color:var(--fg2)}
.mod-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.prose{display:flex;flex-direction:column;gap:var(--s-4);max-width:65ch}
.prose p{font-size:1.02rem}
.kv{display:grid;grid-template-columns:1fr;gap:4px;padding:var(--s-3) 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv dt{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.kv dd{margin:0}
.placeholder{border:1.5px dashed var(--fg2);border-radius:var(--r-sm);padding:8px 12px;font-size:.92rem;color:var(--fg2);background:transparent}
dl{margin:0}

/* forms */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:600;font-size:1.1rem;margin-bottom:var(--s-3);line-height:1.35}
.opts{display:flex;flex-direction:column;gap:10px}
html[data-size="large"] .navbtn{font-size:.62rem}
.opt,.chk{position:relative}
.opt{display:flex;align-items:center;gap:var(--s-3);min-height:56px;padding:12px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt-dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--fg2);display:grid;place-items:center;color:transparent}
.opt input:checked ~ .opt-dot{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.opt:has(input:checked){border-color:var(--primary);background:var(--soft);font-weight:600}
.opt:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.mood-opt{position:relative;display:block;cursor:pointer}
.mood-opt input{position:absolute;opacity:0;width:1px;height:1px}
.mood-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;min-height:104px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:.92rem;font-weight:500;color:var(--fg)}
.mood-card .tick{position:absolute;top:6px;right:6px;display:none;color:var(--primary)}
.mood-opt input:checked + .mood-card{border-color:var(--primary);background:var(--soft);font-weight:700;box-shadow:inset 0 0 0 1px var(--primary)}
.mood-opt input:checked + .mood-card .tick{display:block}
.mood-opt input:focus-visible + .mood-card{outline:3px solid var(--focus);outline-offset:2px}
.mood-card svg.face{color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:.92rem}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk:has(input:checked){border-color:var(--primary);background:var(--soft);font-weight:600}
.chk:has(input:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.chk .mark{width:18px;height:18px;border-radius:5px;border:2px solid var(--fg2);display:grid;place-items:center;color:transparent;flex:none}
.chk input:checked ~ .mark{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border-radius:var(--r-md);border:1.5px solid var(--fg2);background:var(--surface);line-height:1.5}
.field-label{display:block;font-weight:600;margin-bottom:6px}
.hint{font-size:.85rem;color:var(--muted)}
.err{display:flex;gap:8px;align-items:flex-start;color:var(--alert);font-weight:600;font-size:.95rem}
.progress{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.progress > i{display:block;height:100%;background:var(--primary);border-radius:999px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:var(--s-4);width:100%;min-height:56px;padding:10px 0;background:none;border:0;text-align:left;cursor:pointer;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch-track{flex:none;position:relative;width:54px;height:30px;border-radius:999px;border:2px solid var(--fg2);background:transparent;display:flex;align-items:center;padding:0 4px;justify-content:flex-start;font-size:.62rem;font-weight:700}
.switch[aria-checked="true"] .switch-track{background:var(--primary);border-color:var(--primary);justify-content:flex-end;color:var(--on-primary)}
.switch-knob{width:18px;height:18px;border-radius:50%;background:var(--fg2)}
.switch[aria-checked="true"] .switch-knob{background:var(--on-primary)}
.seg{display:inline-flex;border:1.5px solid var(--primary);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:8px 18px;background:transparent;border:0;cursor:pointer;font-weight:600;color:var(--primary)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* relax */
.breath{display:flex;flex-direction:column;align-items:center;gap:var(--s-4);padding:var(--s-5) var(--s-4)}
.breath-stage{position:relative;width:min(280px,76vw);aspect-ratio:1;display:grid;place-items:center}
.breath-ring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--fg2);opacity:.55}
.breath-orb{width:100%;height:100%;border-radius:50%;background:var(--soft);border:3px solid var(--primary);display:grid;place-items:center;will-change:transform}
.breath-txt{position:absolute;text-align:center;display:flex;flex-direction:column;gap:2px;pointer-events:none}
.breath-txt b{font-family:var(--font-display);font-size:1.5rem;font-weight:500}
.breath-txt span{font-size:2.2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}

/* monitoring */
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:104px 1fr 28px;gap:10px;align-items:center;font-size:.9rem}
.barrow .track{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--primary);border-radius:999px}
.barrow b{text-align:right;font-variant-numeric:tabular-nums}
.timeline{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.tl{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.78rem;color:var(--fg2)}
.tl svg{color:var(--primary)}
.tl b{color:var(--fg);font-size:.82rem}
.entry{display:grid;grid-template-columns:44px 1fr;gap:var(--s-3);padding:var(--s-3) 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry svg.face{color:var(--primary)}
.entry-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn-sm{min-height:44px;padding:6px 14px;font-size:.9rem;border-radius:12px}
.act{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.act:first-child{border-top:0}
.act-ic{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--primary)}
.empty{display:flex;flex-direction:column;align-items:center;gap:var(--s-3);text-align:center;padding:var(--s-6) var(--s-4);border:1.5px dashed var(--fg2);border-radius:var(--r-lg)}
@media print{.bottomnav,.rail,.topbar,.no-print{display:none!important}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

    h1=T.h1,h2=T.h2,h3=T.h3,form=T.form,fieldset=T.fieldset,legend=T.legend,lab=T.label,inp=T.input,ta=T.textarea,
    strong=T.strong,small=T.small,aside=T.aside,article=T.article,dl=T.dl,dt=T.dt,dd=T.dd;

var BRAND={name:'BAKESAH',full:'Sahabat Kesehatan Mental Ibu Hamil',tagline:'Kenali perasaan, rawat diri, cari dukungan.',version:'0.1.0-demo'};
var SIM_LABEL='DEMO — TANPA SKOR, BUKAN DIAGNOSIS';

function fmtDate(ts){
  try{return new Date(ts).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
  catch(e){return new Date(ts).toISOString().slice(0,16).replace('T',' ');}
}
function fmtDay(ts){
  try{return new Date(ts).toLocaleDateString('id-ID',{day:'numeric',month:'short'});}
  catch(e){return new Date(ts).toISOString().slice(0,10);}
}
function sampleData(){
  var day=864e5,now=Date.now();
  var rows=[[6,'biasa','Hari yang biasa saja. (Contoh fiktif)',['istirahat']],[5,'cemas','Memikirkan jadwal kontrol. (Contoh fiktif)',['didengar']],
            [3,'baik','Ngobrol sebentar dengan tetangga. (Contoh fiktif)',[]],[2,'tenang','Jalan pagi yang menyenangkan. (Contoh fiktif)',[]],
            [1,'biasa','Agak lelah sore ini. (Contoh fiktif)',['istirahat']]];
  var moods=rows.map(function(r){return {id:uid('mood'),mood:r[1],note:r[2],needs:r[3],at:now-r[0]*day,sample:true};});
  var acts=moods.map(function(m){return {id:uid('act'),type:'mood',label:'Catatan perasaan: '+moodLabel(m.mood),at:m.at,sample:true};});
  acts.push({id:uid('act'),type:'relax',label:'Latihan pernapasan (contoh fiktif)',at:now-2*day+36e5,sample:true});
  return {moods:moods,acts:acts};
}

function Relax(props){
  var ctx=props.ctx;

  var st=useState('idle'),status=st[0],setStatus=st[1];
  var el=useState(0),elapsed=el[0],setElapsed=el[1];
  var last=useRef(0);
  var logged=useRef(false);
  var reduce=useRef(false);
  try{reduce.current=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  useEffect(function(){
    if(status!=='running')return undefined;

    var id=setInterval(function(){
      var now=performance.now(),dt=now-last.current;last.current=now;
      setElapsed(function(e){return Math.min(TOTAL,e+dt);});
    },100);
    return function(){clearInterval(id);};
  },[status]);
  useEffect(function(){
    if(status==='running'&&elapsed>=TOTAL){setStatus('done');}
  },[elapsed,status]);
  useEffect(function(){
    if(status==='done'&&!logged.current&&elapsed>=1000){
      logged.current=true;
      ctx.log('relax','Latihan pernapasan ('+Math.round(elapsed/1000)+' dtk)');
    }
  },[status]);
  function ease(x){return x*x*(3-2*x);}
  var t=elapsed%CYCLE,inhale=t<INH;
  var phaseLeft=inhale?Math.ceil((INH-t)/1000):Math.ceil((CYCLE-t)/1000);
  var scale=inhale?0.64+0.36*ease(t/INH):1-0.36*ease((t-INH)/(CYCLE-INH));
  if(status==='idle')scale=0.64;
  if(reduce.current)scale=0.85;
  var label=status==='idle'?'Siap':status==='paused'?'Dijeda':status==='done'?'Selesai':(inhale?'Tarik napas perlahan':'Hembuskan perlahan');
  function mmss(ms){var s=Math.floor(ms/1000);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
  var pct=Math.round(elapsed/TOTAL*100);
  function start(){setElapsed(0);logged.current=false;setStatus('running');}
  return div({className:'stack-lg'},
    h(PageHead,{eyebrow:'Relaksasi',title:'Pernapasan nyaman',onBack:ctx.back,backLabel:'Kembali',lead:'Sekitar 2 menit. Duduk atau ambil posisi yang nyaman, lemaskan bahu, lalu bernapas perlahan tanpa memaksakan kedalaman napas.'}),
    h(Notice,{kind:'notice-sim',icon:'alert',role:'note'},para(null,strong(null,BREATH_NOTE)),para(null,'Bunda boleh berhenti kapan saja. Latihan ini tidak meminta Bunda menahan napas.')),
    div({className:'card breath'},

      div({className:'stack',style:{width:'100%',gap:'6px'}},
        div({className:'row',style:{justifyContent:'space-between'}},span({className:'hint'},'Kemajuan sesi'),span({className:'hint',style:{fontVariantNumeric:'tabular-nums'}},mmss(elapsed)+' / '+mmss(TOTAL))),
        div({className:'progress',role:'progressbar','aria-label':'Kemajuan sesi latihan','aria-valuemin':0,'aria-valuemax':100,'aria-valuenow':pct},h('i',{style:{width:pct+'%'}}))),
      div({className:'visually-hidden',role:'status','aria-live':'polite'},status==='running'?'Latihan berjalan':status==='paused'?'Latihan dijeda':status==='done'?'Latihan selesai':''),
      status==='done'

            status==='running'?btn({type:'button',className:'btn btn-primary',style:{flex:1},onClick:function(){setStatus('paused');}},'Jeda'):null,
            status==='paused'?btn({type:'button',className:'btn btn-primary',style:{flex:1},onClick:function(){setStatus('running');}},'Lanjutkan'):null,

/* ---------- app ---------- */
function App(){
  var s1=useState([{name:'welcome'}]),stack=s1[0],setStack=s1[1];
  var s2=useState(false),consented=s2[0],setConsented=s2[1];
  var s3=useState(initialData),data=s3[0],setData=s3[1];
  var route=stack[stack.length-1];
  function go(name,params){setStack(function(s){return s.concat([{name:name,params:params}]);});}
  function back(){setStack(function(s){return s.length>1?s.slice(0,-1):[{name:consented?'home':'welcome'}];});}
  function tab(name){setStack([{name:name}]);}
  function log(type,label){setData(function(d){return Object.assign({},d,{activity:[{id:uid('act'),type:type,label:label,at:Date.now()}].concat(d.activity)});});}
  function deleteMood(id){setData(function(d){return Object.assign({},d,{moods:d.moods.filter(function(m){return m.id!==id;})});});}
  function reset(){setData(function(d){return initialData(d.prefs);});}
  function loadSample(){
    setData(function(d){
      if(d.moods.some(function(m){return m.sample;}))return d;
      var s=sampleData();
      return Object.assign({},d,{
        moods:s.moods.concat(d.moods).sort(function(a,b){return b.at-a.at;}),
        activity:s.acts.concat(d.activity).sort(function(a,b){return b.at-a.at;})});
    });
  }
  function consent(){setConsented(true);setStack([{name:'home'}]);}
  var ctx={data:data,setData:setData,go:go,back:back,tab:tab,log:log,deleteMood:deleteMood,reset:reset,loadSample:loadSample,consent:consent,consented:consented};

  useEffect(function(){
    try{window.scrollTo(0,0);}catch(e){}
    var t=document.getElementById('screen-title');
    if(t&&t.focus){try{t.focus({preventScroll:true});}catch(e){}}
  },[stack]);
  useEffect(function(){document.documentElement.setAttribute('data-size',data.prefs.textSize);},[data.prefs.textSize]);

  var name=route.name,body;
  if(name==='welcome')return h(Welcome,{ctx:ctx});
  if(name==='exit')return h(Exit,{ctx:ctx});
  if(name==='privacy'&&!consented)return h(Privacy,{ctx:ctx});
  if(!consented)return h(Welcome,{ctx:ctx});
  switch(name){
    case 'screening':body=h(Screening,{ctx:ctx});break;
    case 'education':body=h(Education,{ctx:ctx});break;
    case 'module':body=h(Module,{ctx:ctx,id:route.params.id,key:route.params.id});break;
    case 'monitoring':body=h(Monitoring,{ctx:ctx});break;
    case 'profile':body=h(Profile,{ctx:ctx});break;
    case 'relax':body=h(Relax,{ctx:ctx});break;
    case 'mood':body=h(Mood,{ctx:ctx});break;
    case 'help':body=h(Help,{ctx:ctx});break;
    case 'privacy':body=h(Privacy,{ctx:ctx});break;
    default:body=h(Home,{ctx:ctx});
  }
  return h(Shell,{ctx:ctx,route:route},body);
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
